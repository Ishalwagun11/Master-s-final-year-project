[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "political-news-credibility"
version = "0.1.0"
description = "Dissertation system for UK political news framing disagreement and source credibility prediction."
requires-python = ">=3.12"
dependencies = [
  "apscheduler>=3.10",
  "beautifulsoup4>=4.12",
  "fastapi>=0.111",
  "feedparser>=6.0",
  "httpx>=0.27",
  "numpy>=1.26",
  "pandas>=2.2",
  "pgvector>=0.3",
  "plotly>=5.22",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "scikit-learn>=1.5",
  "sentence-transformers>=3.0",
  "sqlalchemy>=2.0",
  "streamlit>=1.36",
  "tenacity>=8.3",
  "uvicorn[standard]>=0.30",
  "vaderSentiment>=3.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

